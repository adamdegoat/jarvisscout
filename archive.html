<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis Scout — Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060d1a;--surface:#0d1829;--line:rgba(148,163,184,.1);--muted:#94a3b8;--dim:#4b5a72}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#e2e8f0;font-family:'Inter',sans-serif;font-size:14px;line-height:1.6}
.header{background:rgba(6,13,26,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between}
.wordmark{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;color:#fff;letter-spacing:-.3px}
.wordmark-dot{color:#06b6d4}
.nav-back{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);text-decoration:none;padding:5px 12px;border:1px solid rgba(148,163,184,.2);border-radius:6px;transition:color .15s,border-color .15s}
.nav-back:hover{color:#e2e8f0;border-color:rgba(148,163,184,.45)}
.wrap{max-width:820px;margin:0 auto;padding:48px 32px 80px}
.page-title{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:#fff;margin-bottom:6px}
.page-sub{font-size:13px;color:var(--dim);margin-bottom:36px}
.section-h{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.idea-card{background:rgba(13,24,41,.7);border:1px solid rgba(148,163,184,.1);border-radius:12px;padding:20px;margin-bottom:14px;opacity:0.72}
.idea-title{font-weight:700;font-size:15px;color:#fff;margin-right:8px}
.idea-family{font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace;display:block;margin-top:3px}
.idea-score{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:#06b6d4}
.outcome-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
.idea-summary{font-size:13px;color:var(--muted);line-height:1.65;margin-top:8px}
.score-dims{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.score-dim{background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.15);border-radius:8px;padding:10px 10px 8px}
.sd-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.sd-val{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:700;color:#fff;margin-top:2px}
.score-bar{height:3px;border-radius:2px;margin-top:6px;background:rgba(99,102,241,.25)}
.score-bar-fill{height:3px;border-radius:2px;background:#06b6d4}
.btn-restore{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#10b981;background:transparent;border:1px solid rgba(16,185,129,.25);border-radius:5px;padding:3px 9px;cursor:pointer;transition:color .15s,border-color .15s}
.btn-restore:hover{border-color:rgba(16,185,129,.55)}
.toast{position:fixed;bottom:28px;right:28px;background:#1e293b;border:1px solid rgba(148,163,184,.2);border-radius:8px;padding:10px 18px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#e2e8f0;z-index:999;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.empty-state{text-align:center;padding:40px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="wordmark">Jarvis Scout<span class="wordmark-dot">.</span></div>
    <a href="index.html" class="nav-back">&#8592; Back to Dashboard</a>
  </div>
</header>
<div class="wrap">
  <div class="page-title">&#128451; Archive</div>
  <div class="page-sub">0 idea(s) archived &middot; Click Restore to move an idea back to the active pipeline</div>
  <div class="section-h">Archived Ideas</div>
  <div class="empty-state">No archived ideas yet.</div>
  <div style="margin-top:40px;font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace">
    Updated 2026-06-05 09:00 SGT
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
function copyCmd(cmd) {
  navigator.clipboard.writeText(cmd).then(function() {
    var t = document.getElementById('toast');
    t.textContent = '✓ Copied — paste in Terminal';
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  });
}
</script>
</body>
</html>
